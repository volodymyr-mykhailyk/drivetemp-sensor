version: 2
project_name: drivetemp-sensor

builds:
  - id: drivetemp-sensor
    main: ./cmd/drivetemp-sensor
    binary: drivetemp-sensor
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc

release:
  footer: |
    Container image: `ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/drivetemp-sensor:{{ .Version }}` (linux/amd64, linux/arm64).
